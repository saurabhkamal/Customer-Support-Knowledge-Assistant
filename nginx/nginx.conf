events {}

http {
    server {
        listen 80;

        # Everything goes to the frontend, including /api/*, which Next.js
        # proxies to the backend server-side with the API key attached.
        # The backend is never routed to directly.
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}